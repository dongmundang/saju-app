<style>
  :root{
    --bg:#f4efe6; --ink:#2c2420; --card:#fffdf8; --line:#e0d6c4;

  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.75; }

  .tabs button{ flex:1; padding:10px; background:transparent; color:var(--muted); border:0; border-radius:8px; cursor:pointer; font-size:.95rem; font-weight:600; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }

    #print-foot{ display:block !important; text-align:center; margin-top:20px; padding-top:12px;
      border-top:1px solid #ccc; font-size:.8rem; color:#666; }

</style>

<body>

        사주팔자·신강신약·신살·대운 등 <b>계산 결과는 즉시</b> 나옵니다.

<script>
const now = new Date();
const WXCOLOR = { '목':'var(--wx-mok)', '화':'var(--wx-hwa)', '토':'var(--wx-to)', '금':'var(--wx-geum)', '수':'var(--wx-su)' };
const WXHAN = { '목':'木', '화':'火', '토':'土', '금':'金', '수':'水' };

function formHtml(prefix){
  const years=[]; for(let y=now.getFullYear(); y>=1930; y--) years.push(y);
  return `
    <div id="${prefix}-people" class="people"></div>
    <label>이름 (선택)</label>
    <input id="${prefix}-name" placeholder="이름" />
    <div class="row">
      <div><label>연도</label><select id="${prefix}-year">${years.map(y=>`<option>${y}</option>`).join('')}</select></div>
      <div><label>월</label><select id="${prefix}-month">${Array.from({length:12},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div>
      <div><label>일</label><select id="${prefix}-day">${Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div><label>시 (모르면 비움)</label><select id="${prefix}-hour"><option value="">모름</option>${Array.from({length:24},(_,i)=>`<option value="${i}">${String(i).padStart(2,'0')}시</option>`).join('')}</select></div>
      <div><label>분</label><select id="${prefix}-minute">${Array.from({length:12},(_,i)=>`<option value="${i*5}">${String(i*5).padStart(2,'0')}분</option>`).join('')}</select></div>
      <div><label>성별</label><select id="${prefix}-gender"><option>남</option><option>여</option></select></div>
    </div>
    <label>양력 / 음력</label>
    <select id="${prefix}-cal"><option value="solar">양력 (신분증 생일)</option><option value="lunar">음력 (평달)</option><option value="lunarleap">음력 (윤달)</option></select>
    <div class="chk"><input type="checkbox" id="${prefix}-tst" checked /><label for="${prefix}-tst" style="margin:0">진태양시 보정 (한국 기준 약 -32분, 권장)</label></div>
  `;
}
document.getElementById('form-one').innerHTML=formHtml('one');
document.getElementById('form-a').innerHTML=formHtml('a');
document.getElementById('form-b').innerHTML=formHtml('b');

// ── 저장된 사람 (localStorage) ──
const PKEY='dongmundang_people';
function loadPeople(){ try{ return JSON.parse(localStorage.getItem(PKEY)||'[]'); }catch(e){ return []; } }
function savePeople(arr){ try{ localStorage.setItem(PKEY, JSON.stringify(arr)); }catch(e){} }

function applyPerson(prefix, p){
  const set=(k,v)=>{ const el=document.getElementById(`${prefix}-${k}`); if(el!=null) el.value=v; };
  set('name',p.name||''); set('year',p.year); set('month',p.month); set('day',p.day);
  set('hour',p.hour==null?'':p.hour); set('minute',p.minute||0); set('gender',p.gender||'남');
  set('cal',p.cal||'solar');
  const tst=document.getElementById(`${prefix}-tst`); if(tst) tst.checked = p.tst!==false;
}
function savePerson(prefix){
  const f=readForm(prefix);
  const name=(f.name||'').trim();
  if(!name){ alert('저장하려면 이름을 먼저 입력하세요.'); return; }
  const person={ name, year:f.year, month:f.month, day:f.day, hour:f.hour===''?null:f.hour,
    minute:f.minute||0, gender:f.gender, cal:(f.isLunar?(f.isLeapMonth?'lunarleap':'lunar'):'solar'), tst:f.trueSolarTime };
  const arr=loadPeople().filter(x=>x.name!==name);
  arr.unshift(person); savePeople(arr.slice(0,50)); renderPeople();
}
function deletePerson(name){
  savePeople(loadPeople().filter(x=>x.name!==name)); renderPeople();
}
function renderPeople(){
  const arr=loadPeople();
  ['one','a','b'].forEach(prefix=>{
    const box=document.getElementById(`${prefix}-people`);
    if(!box) return;
    box.innerHTML = `
      <div class="people-row">
        ${arr.length? arr.map(p=>`<span class="pchip" data-n="${encodeURIComponent(p.name)}" data-p="${prefix}">
            ${p.name}<b class="pdel" data-n="${encodeURIComponent(p.name)}">✕</b>
          </span>`).join('') : '<span class="muted" style="font-size:.8rem">저장된 사람 없음</span>'}
        <button type="button" class="psave" data-p="${prefix}">＋ 현재 입력 저장</button>
      </div>`;
    box.querySelectorAll('.pchip').forEach(el=>el.onclick=(ev)=>{
      if(ev.target.classList.contains('pdel')) return;
      const p=loadPeople().find(x=>x.name===decodeURIComponent(el.dataset.n));
      if(p) applyPerson(el.dataset.p, p);
    });
    box.querySelectorAll('.pdel').forEach(el=>el.onclick=(ev)=>{
      ev.stopPropagation();
      if(confirm(decodeURIComponent(el.dataset.n)+' 삭제할까요?')) deletePerson(decodeURIComponent(el.dataset.n));
    });
    box.querySelector('.psave').onclick=()=>savePerson(prefix);
  });
}
renderPeople();

let topic='총운';
document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.topic').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); topic=b.dataset.t;
});

function setTab(t){
  ['one','gung','iching'].forEach(k=>{
    document.getElementById('view-'+k).style.display = t===k?'':'none';
    document.getElementById('tab-'+k).classList.toggle('on', t===k);
  });
}

function readForm(prefix){
  const cal=document.getElementById(`${prefix}-cal`).value;
  return {
    name:document.getElementById(`${prefix}-name`).value,
    year:document.getElementById(`${prefix}-year`).value,
    month:document.getElementById(`${prefix}-month`).value,
    day:document.getElementById(`${prefix}-day`).value,
    hour:document.getElementById(`${prefix}-hour`).value,
    minute:document.getElementById(`${prefix}-minute`).value,
    gender:document.getElementById(`${prefix}-gender`).value,
    isLunar:cal!=='solar', isLeapMonth:cal==='lunarleap',
    trueSolarTime:document.getElementById(`${prefix}-tst`).checked
  };
}

function pillarCell(p, jj){
  return `<td>
    <span class="gz"><span class="g">${p.ganKo}</span><span class="z">${p.zhiKo}</span></span>
    <span class="sub10">${p.han}</span>
    ${jj && jj.length ? `<div class="jj">지장간 ${jj.join('·')}</div>` : ''}
  </td>`;
}

function wxBars(count){
  const max=Math.max(...Object.values(count),1);
  return `<div class="wxbars">${['목','화','토','금','수'].map(n=>{
    const v=count[n]||0;
    return `<div class="wxrow">
      <span class="name">${n} (${WXHAN[n]})</span>
      <span class="track"><span class="fill" style="width:${v/max*100}%;background:${WXCOLOR[n]}"></span></span>
      <span class="num">${v}</span>
    </div>`;
  }).join('')}</div>`;
}

function daeunHtml(d, startAge, basis){
  if(!d || !d.length) return '';
  const scored = d.some(x=>x.score!==null);
  const scoreColor=(s)=> s>=1.5?'var(--wx-mok)': s<=-1.5?'var(--wx-hwa)':'var(--wx-to)';
  const H=90; // 그래프 높이
  const graph = scored ? `
    <div style="display:flex;gap:6px;align-items:flex-end;height:${H+30}px;overflow-x:auto;margin:10px 0;padding-bottom:4px">
      ${d.map(x=>{
        const s=x.score||0;
        const h=Math.max(6, Math.min(H, H/2 + s*8));
        return `<div style="min-width:66px;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:center">
          <div style="font-size:.7rem;color:var(--muted)">${x.score>0?'+':''}${x.score}</div>
          <div style="width:26px;height:${h}px;background:${scoreColor(s)};border-radius:4px 4px 0 0;${x.current?'outline:2px solid var(--plum);outline-offset:1px':''}"></div>
          <div style="font-size:.72rem;margin-top:3px;${x.current?'font-weight:700;color:var(--plum)':''}">${x.startAge}세</div>
          <div style="font-size:.72rem;color:var(--muted)">${x.ganZhiKo}</div>
          <div style="font-size:.68rem;color:${scoreColor(s)}">${x.label}</div>
        </div>`;
      }).join('')}
    </div>
    <p class="muted" style="font-size:.78rem">${basis==='억부용신'?'억부용신':'부족한 오행 보완'} 기준으로 각 대운을 평가한 <b>인생 흐름 그래프</b>입니다. 초록=순풍, 빨강=역풍, 보라 테두리=현재 대운. 절대적 길흉이 아니라 상대적 흐름으로 보세요.</p>` : `
    <div class="daeun">${d.map(x=>`
      <div class="du" ${x.current?'style="outline:2px solid var(--plum)"':''}><div class="age">${x.startAge}세~</div><div class="gz2">${x.ganZhiKo}</div><div class="yr">${x.startYear}~${x.endYear}</div></div>
    `).join('')}</div>`;
  return `<div class="card"><h3>대운 · 인생 흐름 (10년 단위)</h3>
    <p class="muted">약 ${startAge}세부터 대운이 바뀝니다.</p>
    ${graph}</div>`;
}

  return `<div class="card">
    <h3>지지 관계 (형·충·회·합)</h3>

}

function sinsalHtml(list){
  if(!list || !list.length) return '';
  return `<div class="card">
    <h3>신살 (神殺)</h3>
    ${list.map(s=>`<div style="margin:8px 0;padding-bottom:8px;border-bottom:1px solid var(--line)">

function strengthHtml(st){
  if(!st) return '';
  const pct=Math.max(4,Math.min(96,st.score));
  const color = st.verdict==='신강' ? 'var(--wx-hwa)' : st.verdict==='신약' ? 'var(--wx-su)' : 'var(--wx-to)';
  return `<div class="card">
    <h3>신강 · 신약 (일간의 힘)</h3>
    <div style="display:flex;align-items:center;gap:10px;margin:6px 0">
      <span class="muted" style="font-size:.78rem">신약</span>
      <span class="track" style="flex:1;position:relative;height:18px;background:var(--bg);border:1px solid var(--line);border-radius:9px">
        <span style="position:absolute;left:calc(${pct}% - 2px);top:-3px;width:4px;height:24px;background:${color};border-radius:2px"></span>
        <span style="position:absolute;left:50%;top:0;width:1px;height:100%;background:var(--line)"></span>
      </span>
      <span class="muted" style="font-size:.78rem">신강</span>
    </div>
    <p><b style="color:${color}">${st.verdict}</b> · 일간 힘 ${st.score}점 / 100</p>
    ${st.yongsin.length
      ? `<p class="muted">억부용신(도움되는 기운): <b>${st.yongsin.join(', ')}</b> · 꺼리는 기운: ${st.gisin.join(', ')}</p>`
      : `<p class="muted">중화에 가까워 특정 오행 의존도가 낮습니다. 대운 흐름을 중심으로 봅니다.</p>`}
    <p class="muted" style="font-size:.78rem">※ 억부(抑扶) 기준의 자동 계산입니다. 조후·격국 등 다른 관점에서는 달라질 수 있어요.</p>
  </div>`;
}

function mdToHtml(s){
  return String(s).replace(/</g,'&lt;')
    .replace(/^###\s*(.+)$/gm,'<h4 style="color:var(--gold-d);margin:14px 0 4px">$1</h4>')
    .replace(/^\*\*(.+?)\*\*\s*$/gm,'<h4 style="color:var(--gold-d);margin:14px 0 4px">$1</h4>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
}

let timerId=null;
function startTimer(btn,label){ let s=0; btn.disabled=true; btn.textContent=`${label} 0초…`;
  timerId=setInterval(()=>{ s++; btn.textContent=`${label} ${s}초…`; },1000); }
function stopTimer(btn,label){ if(timerId){clearInterval(timerId);timerId=null;} btn.disabled=false; btn.textContent=label; }

function actionsBar(opts){
  const card = (opts && opts.noCard) ? '' : `<button onclick="downloadCard()">📷 이미지 카드로 저장</button>`;
  return `<div class="actions">
    ${card}
    <button onclick="window.print()">📄 인쇄 / PDF</button>
    <button onclick="copyReading(this)">📋 풀이 복사</button>
  </div>`;
}

function downloadCard(){
  const s=currentSaju; if(!s){ alert('먼저 사주를 조회하세요.'); return; }
  const W=1080,H=1350, cv=document.createElement('canvas');
  cv.width=W; cv.height=H; const g=cv.getContext('2d');
  const CREAM='#f4efe6', INK='#2c2420', GOLD='#b8863b', PLUM='#6b4a7a', MUTE='#8a7d6d', LINE='#e0d6c4';
  const WX={목:'#4f9d69',화:'#d6604d',토:'#c9a227',금:'#8895a3',수:'#3f6fb0'};
  g.fillStyle=CREAM; g.fillRect(0,0,W,H);
  g.fillStyle=GOLD; g.fillRect(0,0,W,14);
  const cx=W/2;
  g.textAlign='center';
  g.fillStyle=PLUM; g.font='bold 68px "Malgun Gothic",sans-serif';
  g.fillText('🔮 동문당', cx, 130);
  g.fillStyle=MUTE; g.font='30px "Malgun Gothic",sans-serif';
  g.fillText('사주팔자', cx, 178);

  const nm=(s.pillars && currentLabel) ? currentLabel : '';
  g.fillStyle=INK; g.font='bold 40px "Malgun Gothic",sans-serif';
  g.fillText(nm || ' ', cx, 250);
  g.fillStyle=MUTE; g.font='28px "Malgun Gothic",sans-serif';
  g.fillText(`양력 ${s.input.solar}  ·  음력 ${s.input.lunar}`, cx, 296);

  // 4 기둥
  const cols=['시','일','월','년'];
  const pil=[s.pillars.time,s.pillars.day,s.pillars.month,s.pillars.year];
  const bw=200, gap=24, totalW=bw*4+gap*3, x0=cx-totalW/2, y0=360, bh=300;
  pil.forEach((p,i)=>{
    const x=x0+i*(bw+gap);
    g.fillStyle='#fffdf8'; g.strokeStyle=LINE; g.lineWidth=2;
    g.fillRect(x,y0,bw,bh); g.strokeRect(x,y0,bw,bh);
    g.fillStyle=MUTE; g.font='28px "Malgun Gothic",sans-serif';
    g.fillText(cols[i]+'주', x+bw/2, y0+46);
    g.fillStyle=INK; g.font='bold 92px "Malgun Gothic",sans-serif';
    g.fillText(p.ganKo, x+bw/2, y0+150);
    g.fillText(p.zhiKo, x+bw/2, y0+250);
    g.fillStyle=MUTE; g.font='26px serif';
    g.fillText(p.han, x+bw/2, y0+288);
  });

  let y=y0+bh+70;
  g.fillStyle=INK; g.font='bold 34px "Malgun Gothic",sans-serif';
  g.fillText(`일간 ${s.dayMaster.ganKo} · ${s.dayMaster.wuXing}(${s.dayMaster.yinYang}) · ${s.extra.zodiac}띠`, cx, y);
  y+=54;
  if(s.strength){
    const col = s.strength.verdict==='신강'?WX.화:s.strength.verdict==='신약'?WX.수:WX.토;
    g.fillStyle=col; g.font='bold 34px "Malgun Gothic",sans-serif';
    g.fillText(`${s.strength.verdict}  (일간 힘 ${s.strength.score}/100)`, cx, y);
    y+=50;
  }

  // 오행 막대
  const wxc=s.wuXing.count, mx=Math.max(...Object.values(wxc),1);
  const order=['목','화','토','금','수'];
  const barW=120, bgap=16, bw2=barW*5+bgap*4, bx0=cx-bw2/2;
  y+=30; const baseY=y+180;
  order.forEach((n,i)=>{
    const x=bx0+i*(barW+bgap); const hh=(wxc[n]/mx)*160;
    g.fillStyle=LINE; g.fillRect(x,baseY-160,barW,160);
    g.fillStyle=WX[n]; g.fillRect(x,baseY-hh,barW,hh);
    g.fillStyle=INK; g.font='bold 30px "Malgun Gothic",sans-serif';
    g.fillText(n, x+barW/2, baseY+40);
    g.fillStyle=MUTE; g.font='24px "Malgun Gothic",sans-serif';
    g.fillText(wxc[n], x+barW/2, baseY-hh-14);
  });
  if(s.sinsal && s.sinsal.length){
    g.fillStyle=MUTE; g.font='26px "Malgun Gothic",sans-serif';
    g.fillText('신살: '+s.sinsal.map(x=>x.name).join(' · '), cx, baseY+110);
  }

  g.fillStyle=GOLD; g.fillRect(0,H-70,W,70);
  g.fillStyle='#fff'; g.font='28px "Malgun Gothic",sans-serif';
  g.fillText('동문당  ·  dongmundang-saju.onrender.com', cx, H-28);

  const a=document.createElement('a');
  a.download=`동문당_사주_${nm||'결과'}.png`;
  a.href=cv.toDataURL('image/png');
  a.click();
}
function copyReading(btn){
  const el=document.querySelector('.reading');
  if(!el) return;
  navigator.clipboard.writeText(el.innerText).then(()=>{ btn.textContent='✅ 복사됨'; setTimeout(()=>btn.textContent='📋 풀이 글 복사',1500); });
}

async function runReport(){
  const btn=document.querySelector('#view-one button.go[onclick="runReport()"]');
  const out=document.getElementById('out-one');
  const body=readForm('one');
  const name=(body.name||'').trim();
  const steps=[
    {label:'총운·성격', url:'/api/reading', payload:{...body, topic:'총운'}, key:'reading'},
    {label:'재물·직업', url:'/api/reading', payload:{...body, topic:'재물'}, key:'reading'},
    {label:'연애·결혼', url:'/api/reading', payload:{...body, topic:'연애'}, key:'reading'},
    {label:'가족운',    url:'/api/family',  payload:body, key:'reading'},
    {label:'올해·이번 달', url:'/api/luck',  payload:body, key:'reading'},
  ];
  out.innerHTML=`<div class="card muted">사주팔자를 계산하는 중…</div>`;
  let saju;
  try{
    const rc=await fetch('/api/saju',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const dc=await rc.json(); if(!dc.ok) throw new Error(dc.error); saju=dc.saju;
  }catch(e){ out.innerHTML=`<div class="card err">입력 오류: ${e.message}</div>`; return; }

  btn.disabled=true;
  const results={};
  const t0=Date.now();
  const today=new Date();
  const dstr=`${today.getFullYear()}. ${today.getMonth()+1}. ${today.getDate()}`;

  const render=(activeIdx)=>{
    const done=Object.keys(results).length;
    const elapsed=Math.round((Date.now()-t0)/1000);
    const eta = done? Math.round(elapsed/done*(steps.length-done)) : steps.length*180;
    const progressCard = activeIdx>=0 ? `
      <div class="card">
        <h3>종합 리포트 생성 중… (${done}/${steps.length})</h3>
        <div class="track" style="height:14px;margin:8px 0"><span class="fill" style="width:${done/steps.length*100}%;background:var(--gold);height:100%;display:block;border-radius:7px"></span></div>
        <p class="muted">지금: <b>${steps[activeIdx].label}</b> 작성 중… (한 항목당 2~4분)<br>
        예상 남은 시간 약 <b>${Math.ceil(eta/60)}분</b> · 다른 브라우저 창을 닫으면 빨라집니다. 이 탭은 그대로 두세요.</p>
      </div>` : '';
    const doneCards = steps.filter(s=>results[s.label]!==undefined).map(s=>
      `<div class="card"><h3>${s.label}</h3><div class="reading">${mdToHtml(results[s.label])}</div></div>`).join('');
    const footer = activeIdx<0 ? `
      <div class="card" style="text-align:center">
        <p class="muted">본 리포트는 참고용입니다. · 동문당</p>
        ${actionsBar({noCard:false})}
        <p class="muted" style="font-size:.78rem;margin-top:8px">카톡 전송: "📄 인쇄 / PDF" → 인쇄창에서 <b>"PDF로 저장"</b> → 저장된 PDF를 카톡 대화에 첨부.</p>
      </div>` : '';
    out.innerHTML = `
      <div class="card" style="text-align:center">
        <h2 style="margin:4px 0;color:var(--plum)">🔮 동문당 종합 사주 리포트</h2>
        <p class="muted">${name?name+' 님 · ':''}${saju.input.solar} (음력 ${saju.input.lunar})<br>상담일 ${dstr}</p>
      </div>
      ${sajuCards(saju,name)}
      ${doneCards}
      ${progressCard}
      ${footer}`;
  };

  render(0);
  for(let i=0;i<steps.length;i++){
    render(i);
    const s=steps[i];
    try{
      const r=await fetch(s.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(s.payload)});
      const d=await r.json();
      results[s.label] = d.ok ? (d[s.key]||'(내용 없음)') : `(생성 실패: ${d.error})`;
    }catch(e){ results[s.label] = `(생성 실패: ${e.message})`; }
    render(i+1<steps.length ? i+1 : -1);
  }
  currentSaju=saju; currentLabel=name;
  btn.disabled=false;
}

async function runBanwi(){
  const btn=document.querySelector('#view-one button.go[onclick="runBanwi()"]');
  const out=document.getElementById('out-one');
  const body={...readForm('one'), targetYear:new Date().getFullYear()};
  out.innerHTML=`<div class="card muted">방위를 계산하는 중…</div>`;
  startTimer(btn,'방위 분석 중');
  try{
    const r=await fetch('/api/banwi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json(); if(!d.ok) throw new Error(d.error);
    const b=d.banwi;
    // 3x3 나침반 (가운데는 현재 위치)
    const pos={'북서':[0,0],'북':[0,1],'북동':[0,2],'서':[1,0],'중':[1,1],'동':[1,2],'남서':[2,0],'남':[2,1],'남동':[2,2]};
    const cell=(dir)=>{
      if(dir==='중') return `<div style="background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px 4px;text-align:center;font-size:.8rem;color:var(--muted)">현재<br>집</div>`;
      const t=b.table.find(x=>x.dir===dir)||{verdict:'평이',reasons:[]};
      const c=t.verdict==='좋음'?'var(--wx-mok)':t.verdict==='피하기'?'var(--wx-hwa)':'var(--line)';
      const bg=t.verdict==='좋음'?'rgba(79,157,105,.12)':t.verdict==='피하기'?'rgba(214,96,77,.12)':'var(--card)';
      return `<div style="border:2px solid ${c};background:${bg};border-radius:8px;padding:10px 4px;text-align:center">
        <div style="font-weight:700">${dir}</div>
        <div style="font-size:.76rem;color:${c}">${t.verdict}</div>
        <div style="font-size:.66rem;color:var(--muted)">${t.reasons.join(' ')}</div>
      </div>`;
    };
    const grid=[0,1,2].map(row=>[0,1,2].map(col=>{
      const dir=Object.keys(pos).find(k=>pos[k][0]===row&&pos[k][1]===col);
      return cell(dir);
    }).join('')).join('');
    out.innerHTML=`
      <div class="card">
        <h3>${b.year}년(${b.yearGanZhi}) 이사 방위</h3>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0">${grid}</div>
        <p class="muted" style="font-size:.8rem">현재 사는 집을 가운데에 두고, 새 집이 어느 방향인지로 봅니다.
        올해 대장군방: <b>${b.daejanggun||'-'}</b> · 삼살방: <b>${b.samsal.join(', ')||'-'}</b></p>
      </div>
      <div class="card"><h3>풀이</h3><div class="reading">${mdToHtml(d.reading)}</div>
        <p class="muted">모델: ${d.model} · 참고용</p>${actionsBar({noCard:true})}</div>`;
  }catch(e){
    out.innerHTML=`<div class="card err">방위 분석 오류: ${e.message}</div>`;
  }finally{ stopTimer(btn,'이사 방위 (어느 쪽으로?)'); }
}

function yaoRow(v){
  // 6 노음(x) 7 소양(—) 8 소음(- -) 9 노양(o)
  const yang = (v===7||v===9), changing=(v===6||v===9);
  const bar = yang
    ? `<span style="display:inline-block;width:120px;height:12px;background:var(--ink);border-radius:2px"></span>`
    : `<span style="display:inline-block;width:52px;height:12px;background:var(--ink);border-radius:2px"></span><span style="display:inline-block;width:16px"></span><span style="display:inline-block;width:52px;height:12px;background:var(--ink);border-radius:2px"></span>`;
  return `<div style="margin:7px 0">${bar} ${changing?`<b style="color:var(--wx-hwa)">●변</b>`:''}</div>`;
}

async function runIching(){
  const btn=document.querySelector('#view-iching .go');
  const linesBox=document.getElementById('ic-lines');
  const out=document.getElementById('out-iching');
  out.innerHTML='';
  btn.disabled=true;
  // 던지는 연출: 아래→위 6줄을 순차 표시 (실제 캐스팅은 서버)
  const preview=[];
  linesBox.innerHTML='';
  for(let i=0;i<6;i++){
    await new Promise(r=>setTimeout(r,180));
    const v=[6,7,8,9][Math.floor(Math.random()*4)]; preview.unshift(v);
    linesBox.innerHTML=preview.map(yaoRow).join('');
  }
  btn.textContent='괘를 풀이하는 중… (로컬 AI 1~2분)';
  startTimer(btn,'풀이하는 중');
  try{
    const q=document.getElementById('ic-q').value;
    const r=await fetch('/api/iching',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
    const d=await r.json(); if(!d.ok) throw new Error(d.error);
    // 서버가 실제로 뽑은 6효로 다시 그림
    linesBox.innerHTML=d.cast.lines.slice().reverse().map(yaoRow).join('');
    const c=d.cast;
    out.innerHTML=`
      <div class="card">
        <h3>${c.primary.name} <span class="muted">(${c.primary.num}번)</span></h3>
        <p>${c.primary.meaning}</p>
        ${c.changed
          ? `<p class="muted">변효: ${c.changingYao.join(', ')} → 변괘 <b>${c.changed.name}</b>(${c.changed.num}번)<br>${c.changed.meaning}</p>`
          : `<p class="muted">변효 없음 — 본괘로만 봅니다.</p>`}
      </div>
      <div class="card">
        <h3>풀이</h3>
        <div class="reading">${mdToHtml(d.reading)}</div>
        <p class="muted">모델: ${d.model} · 참고용</p>
        ${actionsBar({noCard:true})}
      </div>`;
  }catch(e){
    out.innerHTML=`<div class="card err">오류: ${e.message}</div>`;
  }finally{ stopTimer(btn,'🪙 동전 던지기'); }
}
